<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
body{font:15px system-ui;color:var(--color-text-primary,#173b3b);background:var(--color-background-primary,#fff);padding:20px;margin:0}
h1{font-size:22px;margin:10px 0}.badge{background:#e4f5f1;color:#173b3b;padding:5px 10px;border-radius:8px;display:inline-block}
dl{display:grid;grid-template-columns:120px 1fr;gap:10px}dt{opacity:.7}dd{margin:0;overflow-wrap:anywhere}
#photos{display:flex;gap:8px;overflow:auto;margin:15px 0}img{height:120px;border-radius:8px}
pre{white-space:pre-wrap;font:inherit}button{background:#007e80;color:white;border:0;border-radius:8px;padding:14px 20px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}#result{white-space:pre-wrap;margin-top:14px}small{display:block;margin:16px 0}
</style><title>Riepilogo Vinted</title></head><body>
<span class="badge" id="mode">Caricamento…</span><h1 id="title">Riepilogo annuncio</h1>
<div id="photos"></div><dl id="details"></dl><pre id="description"></pre>
<small>Verifica foto, marca, taglia, condizioni e prezzo. Confermando invii questo esatto annuncio.
L'integrazione non ufficiale può comportare restrizioni dell'account.</small>
<button id="confirm" disabled>Conferma e pubblica</button><div id="result" role="status"></div>
<script>
let draft=null,busy=false,next=0;const pending=new Map();const $=id=>document.getElementById(id);
function rpc(method,params){return new Promise((resolve,reject)=>{const id=++next;
 const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Nessuna risposta. Controlla lo stato prima di riprovare.'))},45000);
 pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
function render(data,meta={}){
 if(!data?.listing)return;draft=data;const l=data.listing;
 $('mode').textContent=data.mode==='mock'?'SIMULAZIONE · nessun invio reale':'VINTED · pubblicazione reale';
 $('title').textContent=l.title;$('description').textContent=l.description;$('details').replaceChildren();
 for(const [key,value]of Object.entries({'Prezzo':l.price+' '+l.currency,'Categoria':l.category_label+' (#'+l.catalog_id+')',
 'Marca':l.brand+' (#'+l.brand_id+')','Taglia':l.size_label+' (#'+(l.size_id??'—')+')',
 'Condizioni':l.condition_label+' (#'+l.status_id+')','Pacco':l.package_label+' (#'+l.package_size_id+')',
 'Colori (ID)':l.color_ids.join(', ')||'—','Foto':l.photo_ids.length,'Stato':data.state,
 'Scadenza':new Date(data.expires*1000).toLocaleString('it-IT')})){
  const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=value;$('details').append(dt,dd);}
 $('photos').replaceChildren();for(const src of meta.photo_previews||[]){if(!src.startsWith('data:image/jpeg;base64,'))continue;
 const img=document.createElement('img');img.src=src;img.alt='Foto articolo';$('photos').append(img);}
 $('confirm').textContent=data.mode==='mock'?'Conferma simulazione':'Conferma e pubblica';
 $('confirm').disabled=busy||data.state!=='prepared'||Date.now()>data.expires*1000;
 if(data.result)$('result').textContent=JSON.stringify(data.result,null,2);
}
window.addEventListener('message',event=>{
 if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;
 if(m.method==='ui/notifications/tool-result')render(m.params?.structuredContent,m.params?._meta);
 if(pending.has(m.id)){const p=pending.get(m.id);clearTimeout(p.timer);pending.delete(m.id);
 m.error?p.reject(new Error(m.error.message)):p.resolve(m.result);}
});
window.addEventListener('openai:set_globals',()=>render(window.openai?.toolOutput,window.openai?.toolResponseMetadata));
$('confirm').onclick=async()=>{
 if(!draft||busy)return;busy=true;$('confirm').disabled=true;$('result').textContent='Invio in corso…';
 try{const args={draft_id:draft.id};const r=window.openai?.callTool?
 await window.openai.callTool('publish_listing',args):await rpc('tools/call',{name:'publish_listing',arguments:args});
 let data=r.structuredContent;if(!data){const text=(r.content||[]).find(c=>c.type==='text')?.text;
 data=text?JSON.parse(text):r;}$('result').textContent=data.message||data.url||JSON.stringify(data,null,2);
 }catch(e){$('result').textContent=e.message+' Controlla Vinted prima di creare un nuovo annuncio.';}
 // Never re-enable after timeout: a request may have succeeded. Re-read using get_listing.
};
if(window.openai?.toolOutput)render(window.openai.toolOutput,window.openai.toolResponseMetadata);
rpc('ui/initialize',{protocolVersion:'2026-01-26',appCapabilities:{},appInfo:{name:'vinted-review',version:'0.1.0'}})
 .then(()=>window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*')).catch(()=>{});
</script></body></html>
