[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "personal-vinted-mcp"
version = "0.1.0"
description = "Personal Vinted listing drafts and confirmed publication over MCP"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["mcp>=1.30,<2", "httpx>=0.28,<1", "pillow>=12.3,<13", "uvicorn>=0.35,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
vinted-mcp = "vinted_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vinted_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110
